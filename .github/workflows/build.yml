name: Build Manhwa Studio Pro APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -o *.zip -d project

      - name: Allow AQ API keys
        run: |
          python3 -c "
          import glob, re
          for f in glob.glob('project/**/*.html', recursive=True) + glob.glob('project/**/*.js', recursive=True):
              txt = open(f, encoding='utf-8', errors='ignore').read()
              txt = txt.replace(\"startsWith('AIza')\", \"startsWith('')\").replace('startsWith(\"AIza\")', 'startsWith(\"\")')
              txt = re.sub(r'\^AIza', '^(AIza|AQ\\\\.)', txt)
              open(f, 'w', encoding='utf-8').write(txt)
          "

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        working-directory: project
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ManhwaStudioPro-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
